# XcodeGen spec for DualDS. Generate the Xcode project with:  Scripts/bootstrap.sh
# (or `xcodegen generate`). DualDS.xcodeproj is generated from this file — edit this, not the project.
name: DualDS
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DualDS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Models
      - path: Services
      - path: Rendering
      - path: EmulatorBridge
      - path: Resources
    dependencies:
      # Built by Scripts/build-core.sh (melonDS + DualDSCore, static, device + simulator slices).
      - framework: Build/DualDSCore.xcframework
        embed: false
      # Downloads FoldPlay Originals (Apple-hosted asset packs).
      - target: FoldPlayAssets
    entitlements:
      path: App/DualDS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(DUALDS_BUNDLE_ID)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FoldPlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: FoldPlay plays the songs you pick from Apple Music while you play games.
        # Apple-Hosted Background Assets (FoldPlay Originals are on-demand asset packs).
        BAAppGroupID: group.$(DUALDS_BUNDLE_ID)
        BAHasManagedAssetPacks: true
        BAUsesAppleHosting: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Documents folder visible in Files ("On My iPhone > DualDS"); .nds files open in DualDS.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Nintendo DS ROM
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.dualds.nds-rom]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.dualds.nds-rom
            UTTypeDescription: Nintendo DS ROM
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nds]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DUALDS_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: EmulatorBridge/DualDS-Bridging-Header.h
  FoldPlayAssets:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AssetsExtension
    info:
      path: AssetsExtension/Info.plist
      properties:
        CFBundleDisplayName: FoldPlay Assets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
    entitlements:
      path: AssetsExtension/FoldPlayAssets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(DUALDS_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DUALDS_BUNDLE_ID).assets
        GENERATE_INFOPLIST_FILE: NO
  DualDSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DualDSTests
      - path: Config/FoldPlay.storekit
        buildPhase: resources
      # Original DualDS test ROM (see Tests/Fixtures/testrom). Test bundle only — never shipped in the app.
      - path: Tests/Fixtures/testrom/dualds-test.nds
        buildPhase: resources
    dependencies:
      - target: DualDS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DUALDS_BUNDLE_ID).tests
        # StoreKitTest's own SDK header uses an API Apple deprecated in iOS 18; with warnings as
        # errors that would stop its module from building. Our sources stay under the warning gate.
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -Wno-deprecated-declarations
        SWIFT_OBJC_BRIDGING_HEADER: EmulatorBridge/DualDS-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
  DualDSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AppUITests
      - path: Tests/Fixtures/testrom/dualds-test.nds
        buildPhase: resources
    dependencies:
      - target: DualDS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DUALDS_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DualDS
schemes:
  DualDS:
    build:
      targets:
        DualDS: all
    run:
      config: Debug
      storeKitConfiguration: Config/FoldPlay.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DualDSTests
        - DualDSUITests
